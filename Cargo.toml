[workspace]
resolver = "2"
members = [
    "crates/emu-core",
    "crates/armv7m-vfp",
    "crates/armv7m",
    "crates/stm32",
    "crates/ngc",
    "crates/ngc-cli",
    "crates/ngc-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# No crates.io dependencies are permitted (offline, provenance-free build).

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
incremental = false

# Firmware-scale tests need optimized code.
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 1
